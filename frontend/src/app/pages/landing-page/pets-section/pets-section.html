<section>

  <h2>Mascotas disponibles</h2>

  <div class="pets-grid">

    @for (pet of pets; track pet.id) {
      <div
        class="pet-card"
        (click)="goToDetail(pet.id)"
      >
        <img [src]="pet.image_url" alt="pet" />

        <h3>{{ pet.name }}</h3>

        <p>{{ pet.breed }}</p>
      </div>
    }

  </div>

  <button routerLink="/pets">
    Ver más mascotas
  </button>

</section>
