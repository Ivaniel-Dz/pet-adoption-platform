<section class="home">
  <div class="description">
    <h1 class="title"><span class="gradient-text">Salva una Vida,</span> Adopta con Amor</h1>
    <p class="paragraph">
      Miles de perros y gatos callejeros esperan una segunda oportunidad. Únete a nuestra fundación
      y sé el hogar que tanto necesitan. Juntos podemos hacer la diferencia.
    </p>
    <button type="button" class="btn" aria-label="Quiero adoptar">
      <span>Quiero Adoptar</span>
    </button>
  </div>

  <div class="users-color-container">
    <span class="item" [style.--i]="1"></span>
    <img
      class="item"
      src="https://images.pexels.com/photos/733416/pexels-photo-733416.jpeg"
      [style.--i]="2"
      alt="Perro callejero esperando adopción"
    />
    <span class="item" [style.--i]="3"></span>
    <img
      class="item"
      src="https://cdn.pixabay.com/photo/2017/11/09/21/41/cat-2934720_1280.jpg"
      [style.--i]="4"
      alt="Gato rescatado listo para adoptar"
    />

    <img
      class="item"
      src="https://images.pexels.com/photos/33100775/pexels-photo-33100775.jpeg"
      [style.--i]="10"
      alt="Mascota rescatada feliz"
    />
    <span class="item" [style.--i]="11"></span>
    <img
      class="item"
      src="https://images.pexels.com/photos/14048881/pexels-photo-14048881.jpeg"
      [style.--i]="12"
      alt="Perro adoptado con su nueva familia"
    />
    <span class="item" [style.--i]="5"></span>

    <span class="item" [style.--i]="9"></span>
    <img
      class="item"
      src="https://images.pexels.com/photos/18847730/pexels-photo-18847730.jpeg"
      [style.--i]="8"
      alt="Gato callejero rescatado"
    />
    <span class="item" [style.--i]="7"></span>
    <img
      class="item"
      src="https://images.pexels.com/photos/12646676/pexels-photo-12646676.jpeg"
      [style.--i]="6"
      alt="Mascota esperando un hogar"
    />
  </div>
</section>
