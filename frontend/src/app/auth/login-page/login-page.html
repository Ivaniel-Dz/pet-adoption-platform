<!-- Header -->
<app-navigation />

<section class="auth-section">
  <div class="auth-section__inner">
    <div class="auth-section__card">

      <h1 class="auth-section__title">Accede a tu cuenta</h1>

      <form class="auth-section__form" [formGroup]="loginForm" (ngSubmit)="signIn()">

        <label class="auth-section__label">
          <span class="auth-section__label-text">Tu Email</span>
          <input class="auth-section__input" type="email" placeholder="Ex. james@bond.com" inputmode="email" formControlName="email" />
        </label>
        <app-message-invalid-component [formGroup]="loginForm" controlName="email" message="Email es requerido" />

        <label class="auth-section__label">
          <span class="auth-section__label-text">Tu Contraseña</span>
          <input class="auth-section__input" type="password" placeholder="••••••••" formControlName="password" />
        </label>
        <app-message-invalid-component [formGroup]="loginForm" controlName="password" message="Contraseña es requerida" />

        <input class="auth-section__submit" type="submit" value="Iniciar sesión" [disabled]="loading()" />

      </form>

      <div>
        <div class="auth-section__divider">
          <span class="auth-section__divider-text">O</span>
        </div>
        <div class="auth-section__action">
          <a routerLink="/auth/register" class="auth-section__action-btn">
            Crear una cuenta
          </a>
        </div>
      </div>

    </div>

    <p class="auth-section__footer-links">
      <a href="#" class="auth-section__footer-link">¿Olvidaste tu contraseña?</a>
      ·
      <a href="#" class="auth-section__footer-link">Privacidad &amp; Términos</a>
    </p>
  </div>
</section>
